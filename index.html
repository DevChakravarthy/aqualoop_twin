<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AquaLoop AI – Digital Twin</title>
<style>
:root{color-scheme:dark;--bg:#04101a;--pan:rgba(7,27,41,.82);--line:rgba(46,232,255,.22);--acc:#22e6c4;--cy:#2ee8ff;--ink:#e4fbff;--mut:#8fb1bb;--warn:#ffb547;--crit:#ff5d6c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 "Segoe UI",Roboto,system-ui,sans-serif}
.top{height:56px;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:#06161f}
.top h1{font-size:16px;margin:0;font-weight:600}.top h1 small{color:var(--mut);font-weight:400;margin-left:8px;font-size:12px}
.ctl{display:flex;gap:12px;align-items:center;margin-left:auto;flex-wrap:wrap}
label{font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:1px}
select,button{font:inherit;color:var(--ink);background:#0a2736;border:1px solid var(--line);border-radius:7px;padding:4px 8px;cursor:pointer}
input[type=range]{accent-color:var(--acc);width:110px}
button:focus-visible,select:focus-visible,#cv:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg button{border-radius:0}.seg button:first-child{border-radius:7px 0 0 7px}.seg button:last-child{border-radius:0 7px 7px 0}
.on{background:var(--acc)!important;color:#04222a!important;border-color:var(--acc)!important;font-weight:600}
.stage{position:relative;height:calc(100vh - 56px);min-height:800px;overflow:hidden;background:radial-gradient(900px 500px at 50% 48%,#0d3a4d,#04101a 75%)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.ov{position:absolute}
.rail{position:absolute;left:8px;top:12px;width:38px;display:flex;flex-direction:column;gap:8px;z-index:2}
.rail button{width:38px;height:38px;padding:0;font-size:15px;background:var(--pan);border-radius:9px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:10px;backdrop-filter:blur(5px);box-shadow:0 0 22px rgba(34,230,196,.07)}
.L{left:56px;top:12px;width:276px;display:flex;flex-direction:column;gap:10px}
.R{right:12px;top:12px;bottom:184px;width:284px;display:flex;flex-direction:column;gap:8px}
.C{left:50%;transform:translateX(-50%);top:12px;width:min(470px,34%);display:flex;flex-direction:column;gap:8px}
.B1{left:56px;bottom:12px;width:306px;height:172px}.B2{left:372px;bottom:12px;width:338px;height:172px}.B3{right:12px;bottom:12px;width:284px;height:164px}
h2{font-size:12px;margin:0 0 6px;font-weight:600}
.chip{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--mut);margin-left:4px}.chip.bad{color:var(--crit);border-color:var(--crit)}
.g{display:grid;grid-template-columns:1fr 104px;gap:8px}
.big{font-size:12px;color:var(--mut)}
.hex{display:inline-flex;width:26px;height:26px;border-radius:7px;align-items:center;justify-content:center;font-size:10px;border:2px solid;background:#0a2736;margin-right:6px;cursor:pointer;padding:0}
.opt{border:1px solid var(--acc);border-radius:8px;padding:6px;font-size:11px;background:rgba(34,230,196,.06)}
.opt b{display:block;font-size:16px;color:var(--acc);line-height:1.2}
.alert{border-left:3px solid;padding:7px 10px;font-size:12px}.alert strong{display:block;font-size:13px}
.vb{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:11px}.vb button{padding:2px 8px;font-size:11px}
.vb label{flex-direction:row;align-items:center;gap:4px}
.ac{border:1px solid var(--line);border-radius:8px;background:var(--pan)}
.ac>button{width:100%;display:flex;align-items:center;gap:6px;background:none;border:0;text-align:left;padding:6px 8px}
.ac>button b{margin-left:auto;font-weight:600}
.ac.on{border-color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:2px 10px 8px;font-size:12px}.kv span:nth-child(odd){color:var(--mut)}.kv span:nth-child(even){text-align:right}
.acs{overflow:auto;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
svg{display:block;width:100%;height:auto}.t{fill:var(--ink)}.m{fill:var(--mut)}
.lg{display:flex;flex-wrap:wrap;gap:3px;font-size:10px;margin-top:2px}.lg i{border:1px solid;border-radius:4px;padding:0 4px;font-style:normal}
.dn{display:flex;gap:8px;justify-content:space-around}.dn>div{text-align:center;font-size:11px}
.note{position:absolute;left:50%;transform:translateX(-50%);bottom:190px;font-size:11px;color:var(--mut);pointer-events:none;text-align:center;width:40%}
@media (max-width:1000px){
 .stage{height:auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding:0 10px 14px}
 #cv{position:relative;height:400px;border-radius:10px;border:1px solid var(--line)}
 .ov,.rail{position:static;transform:none;width:auto;height:auto}.rail{display:none}.note{display:none}
 .R{order:5}.C{order:1}.L{order:3}.B1,.B2,.B3{order:6}.top{height:auto;padding:8px 12px;flex-wrap:wrap}.ctl{margin-left:0}
 .acs{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <h1>AquaLoop AI<small>Digital twin of your purifier</small></h1>
  <div class="ctl">
    <label>Location<select id="city"></select></label>
    <label><span>TDS: <span id="tv"></span> ppm</span><input id="tds" type="range" min="50" max="1500" step="10"></label>
    <label><span>Daily use: <span id="uv"></span> L</span><input id="use" type="range" min="5" max="100" step="1"></label>
    <label>Mode<span class="seg" id="mode"><button data-m="RO">RO</button><button data-m="Non-RO">Non-RO</button></span></label>
  </div>
</header>
<main class="stage">
  <canvas id="cv" tabindex="0" role="img" aria-label="Interactive 3D digital twin of the 7-stage purifier. Drag to rotate, scroll to zoom, click a stage to select it."></canvas>
  <nav class="rail" aria-label="3D view tools">
    <button id="rIso" title="Reset view" aria-label="Reset view">⌂</button>
    <button id="rAu" title="Auto-rotate" aria-label="Auto-rotate">⟳</button>
    <button id="rEx" title="Explode view" aria-label="Explode view">✥</button>
  </nav>
  <div class="ov L" id="L"></div>
  <div class="ov C"><div class="card alert" id="alert"></div>
    <div class="card vb"><button data-v="front">Front</button><button data-v="side">Side</button><button data-v="back">Back</button><button data-v="top">Top</button><button data-v="iso">Isometric</button><button id="au">Auto-rotate</button><label>Explode <input id="ex" type="range" min="0" max="1" step=".01" value="0" style="width:80px"></label></div></div>
  <div class="ov R"><div class="card" id="m1"></div><div class="card" id="m2"></div><div class="acs" id="acc"></div></div>
  <div class="ov card B1"><h2 id="wt">Wear</h2><div id="wear"></div></div>
  <div class="ov card B2"><h2>Replacement timeline (days left)</h2><div id="tl"></div></div>
  <div class="ov card B3" id="dn"></div>
  <div class="note">Drag to rotate · scroll or pinch to zoom · click a stage to inspect it</div>
</main>

<script>
const C={"Chennai":{t:450,h:160,cl:150,f:.7,n:22,u:2},"Bengaluru":{t:300,h:120,cl:60,f:.5,n:15,u:1.5},"Delhi":{t:800,h:190,cl:240,f:1.2,n:35,u:3},"Jaipur":{t:1100,h:230,cl:380,f:1.8,n:48,u:3.5},"Kochi":{t:120,h:50,cl:25,f:.2,n:5,u:2}};
const S=[{n:"Sediment",L:6000,a:138,w:[.1,.2,1.2]},{n:"Pre-carbon",L:9000,a:150,w:[.2,.2,.6]},{n:"RO membrane",L:20000,a:330,w:[.9,.6,.3],ro:1},{n:"UF",L:18000,a:200,w:[.1,.2,.5]},{n:"UV lamp",L:12000,a:345,w:[0,0,.1]},{n:"Post-carbon",L:9000,a:150,w:[.1,.1,.2]},{n:"Mineralizer",L:6000,a:120,w:[.1,.3,0]}];
const st={city:"Chennai",tds:450,use:30,mode:"RO",sel:null,ages:S.map(s=>s.a)};
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const dd=x=>x>=999?"999+":Math.round(x);
const fm=x=>Math.round(x).toLocaleString("en-IN");
const col=d=>d<=14?"var(--crit)":d<=45?"var(--warn)":"var(--acc)";
const hx=d=>d<=14?"#ff5d6c":d<=45?"#ffb547":"#22e6c4";
const PAL=["#22e6c4","#2ee8ff","#3b82f6","#7c5cff","#9be15d","#ffb547","#ff7aa8"];

function prof(){const c=C[st.city];const k=clamp(Math.sqrt(st.tds/c.t),.6,1.6);
  const oor=c.h*k>200||st.tds>1500||c.u>5;
  const conf=oor?55:Math.round(clamp(92-Math.abs(st.tds-c.t)/c.t*50,45,92));
  return{k,conf,oor,H:c.h*k,T:c.u,it:[["Hardness",c.h*k,200],["Chloride",c.cl*k,250],["Fluoride",c.f*k,1],["Nitrate",c.n*k,45]]};}
function model(){const p=prof();
  const f=[clamp((st.tds-200)/500,0,9),clamp((p.H-80)/200,0,9),clamp((p.T-1)/5,0,9)];
  const names=["high TDS","hard water","turbid water"];
  const rows=S.map((s,i)=>{const con=s.w.map((w,j)=>w*f[j]);const sh=1+con[0]+con[1]+con[2];
    const sf=(s.ro&&st.mode==="Non-RO")?.05:sh;const used=st.use*st.ages[i]*sh;
    const hp=clamp(100*(1-used/s.L),0,100);const rem=Math.max(0,(s.L-used)/(st.use*sf));
    return{i,n:s.n,L:s.L,used,hp,rem,sh,sf,con,why:con.map((c,j)=>c>.1?names[j]:null).filter(Boolean),remIfNon:s.ro?Math.max(0,(s.L-used)/(st.use*.05)):0};});
  return{p,rows};}

function gauge(pc,color){const len=188.5;
  return `<svg viewBox="0 0 140 84"><path d="M10 74A60 60 0 0 1 130 74" fill="none" stroke="#123a4c" stroke-width="10" stroke-linecap="round"/><path d="M10 74A60 60 0 0 1 130 74" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${pc/100*len} ${len}"/><text x="70" y="62" text-anchor="middle" class="t" font-size="26" font-weight="700">${pc.toFixed(1)}</text><text x="70" y="78" text-anchor="middle" class="m" font-size="9">Filter health (%)</text></svg>`;}
function donut(v,c){const t=v.reduce((a,b)=>a+b,0)||1;let o=0;
  return `<svg viewBox="0 0 80 80" style="width:76px;margin:auto">${v.map((x,i)=>{const l=x/t*175.9,s=`<circle cx="40" cy="40" r="28" fill="none" stroke="${c[i]}" stroke-width="12" stroke-dasharray="${l} ${175.9-l}" stroke-dashoffset="${-o}" transform="rotate(-90 40 40)"/>`;o+=l;return s;}).join("")}</svg>`;}
function spark(v,bar,color,unit){const w=250,h=58,mxv=Math.max(...v)*1.12,n=v.length,X=i=>8+i*(w-16)/(n-1),Y=x=>h-12-x/mxv*(h-20);
  let b=bar?v.map((x,i)=>`<rect x="${8+i*(w-16)/n}" y="${Y(x)}" width="${(w-16)/n-3}" height="${h-12-Y(x)}" fill="${color}" opacity=".85"/>`).join(""):
   `<polygon points="${X(0)},${h-12} ${v.map((x,i)=>X(i)+","+Y(x)).join(" ")} ${X(n-1)},${h-12}" fill="${color}" opacity=".18"/><polyline points="${v.map((x,i)=>X(i)+","+Y(x)).join(" ")}" fill="none" stroke="${color}" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${w} ${h}">${b}<text x="8" y="${h-1}" class="m" font-size="8">Jan</text><text x="${w-8}" y="${h-1}" text-anchor="end" class="m" font-size="8">Dec</text><text x="${w-8}" y="9" text-anchor="end" class="m" font-size="8">${unit}</text></svg>`;}

function wear(s){const a=Math.max(st.ages[s.i],5),R=Math.min(s.rem,400),W=290,H=118,l=26,r=8,t=8,b=18;
  const xmin=-a,xmax=R*1.15+10,X=d=>l+(d-xmin)/(xmax-xmin)*(W-l-r),Y=p=>H-b-p/100*(H-t-b);const now=100-s.hp;
  let pts=[];for(let k=0;k<=20;k++){const d=-a+a*k/20;pts.push(`${X(d).toFixed(1)},${Y(clamp(now*(d+a)/a+Math.sin(d*.7)*1.2*(k>0&&k<20?1:0),0,100)).toFixed(1)}`);}
  const al=Math.max(0,R-14);
  return `<svg viewBox="0 0 ${W} ${H}"><line x1="${l}" x2="${W-r}" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--crit)" stroke-dasharray="3 3"/><text x="${l+2}" y="${Y(100)-2}" class="m" font-size="8">end of life</text>
<polygon points="${X(0)},${Y(now)} ${X(R*.85)},${Y(100)} ${X(R*1.15)},${Y(100)}" fill="var(--warn)" opacity=".22"/>
<polyline points="${pts.join(" ")}" fill="none" stroke="var(--acc)" stroke-width="2"/>
<line x1="${X(0)}" y1="${Y(now)}" x2="${X(R)}" y2="${Y(100)}" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="${X(0)}" x2="${X(0)}" y1="${t}" y2="${H-b}" stroke="var(--mut)"/><text x="${X(0)}" y="${H-5}" text-anchor="middle" class="m" font-size="8">today</text>
<line x1="${X(al)}" x2="${X(al)}" y1="${t}" y2="${H-b}" stroke="var(--crit)" stroke-dasharray="2 3"/><text x="${X(al)}" y="${t+7}" text-anchor="end" fill="var(--crit)" font-size="8">alert</text>
<text x="2" y="${Y(100)+3}" class="m" font-size="8">100</text><text x="2" y="${Y(0)+3}" class="m" font-size="8">0</text><text x="${l}" y="${H-5}" class="m" font-size="8">${-a}d</text><text x="${W-r}" y="${H-5}" text-anchor="end" class="m" font-size="8">+${dd(R*1.15)}d</text></svg>
<div class="lg"><i style="color:var(--acc)">Actual</i><i style="color:var(--warn)">Predict ±15%</i></div>`;}
function timeline(r){const M=120,x0=78,w=230,rh=19;const X=d=>x0+Math.min(d,M)/M*w;
  let h=`<svg viewBox="0 0 320 ${r.length*rh+14}"><rect x="${x0}" y="0" width="${X(14)-x0}" height="${r.length*rh}" fill="var(--crit)" opacity=".14"/>`;
  r.forEach((s,k)=>{const y=k*rh+2,c=col(s.rem);
    h+=`<text x="0" y="${y+10}" class="${st.sel===s.i?"t":"m"}" font-size="9">${s.i+1}# ${s.n}</text><rect x="${x0}" y="${y+2}" width="${w}" height="8" rx="4" fill="#123a4c"/>
<rect x="${X(s.rem*.85)}" y="${y+2}" width="${Math.max(0,X(s.rem*1.15)-X(s.rem*.85))}" height="8" fill="${c}" opacity=".35"/>
<rect x="${x0}" y="${y+2}" width="${Math.max(2,X(s.rem*.85)-x0)}" height="8" rx="4" fill="${c}"/><text x="${Math.min(X(s.rem*1.15)+4,300)}" y="${y+10}" class="t" font-size="8">${dd(s.rem)}</text>`;});
  return h+`<text x="${x0}" y="${r.length*rh+11}" class="m" font-size="8">alert zone ≤14 days</text><text x="${x0+w}" y="${r.length*rh+11}" text-anchor="end" class="m" font-size="8">120+ days</text></svg>`;}

function render(){const m=model(),r=m.rows,p=m.p;T.rows=r;
  const worst=r.reduce((a,b)=>b.rem<a.rem?b:a);if(st.sel===null)st.sel=worst.i;const sel=r[st.sel];
  $("#tv").textContent=st.tds;$("#uv").textContent=st.use;
  document.querySelectorAll("#mode button").forEach(b=>b.classList.toggle("on",b.dataset.m===st.mode));
  // advisor
  const ro=r[2];let adv,advS;
  if(st.mode==="RO"&&st.tds<=300){adv="Non-RO";advS=`RO life ${dd(ro.rem)}d to ${ro.remIfNon>=730?"2+ years":dd(ro.remIfNon)+"d"}`;}
  else if(st.tds>=500){adv="Keep RO";advS=`TDS ${st.tds} ppm is above 500 ppm`;}
  else{adv="Either mode";advS="RO to drink, Non-RO to cook";}
  const grp=(ids,title,opt)=>{const g=ids.map(i=>r[i]),avg=g.reduce((a,b)=>a+b.hp,0)/g.length,mn=Math.min(...g.map(x=>x.rem)),sf=g.reduce((a,b)=>a+b.sf,0)/g.length;
    return `<div class="card"><h2>${title}<span class="chip">Advisory</span>${mn<=14?'<span class="chip bad">Issue</span>':""}</h2><div class="g"><div>${gauge(avg,avg<40?"#ffb547":"#22e6c4")}<div class="big">Min days left <b style="color:${hx(mn)}">${dd(mn)}</b> · Use ${st.use} L/d · Stress ×${sf.toFixed(2)}</div></div>${opt}</div><div style="margin-top:6px">${g.map(x=>`<button class="hex" style="border-color:${hx(x.rem)};${x.i===st.sel?"box-shadow:0 0 8px "+hx(x.rem):""}" onclick="pick(${x.i})" aria-label="${x.n}">${x.i+1}#</button>`).join("")}</div></div>`;};
  $("#L").innerHTML=grp([0,1,2],"Group 1: pre-treatment + RO",`<div class="opt">Optimization<b>${adv}</b>${advS}</div>`)+grp([3,4,5,6],"Group 2: polishing",`<div class="opt">Next replacement<b>${worst.n}</b>in ${dd(worst.rem)} days</div>`);
  // alert
  const lvl=worst.rem<=14?"crit":worst.rem<=45?"warn":"ok",lo=dd(worst.rem*.85),hi=dd(worst.rem*1.15),when=worst.rem<1?"now":"within "+dd(worst.rem)+" days";
  const cause=worst.why.length?`${worst.n} wearing faster: ${worst.why.join(" plus ")}.`:`${worst.n} is wearing at the normal rate.`;
  $("#alert").style.borderColor=lvl==="crit"?"var(--crit)":lvl==="warn"?"var(--warn)":"var(--acc)";
  $("#alert").innerHTML=`<strong style="color:${lvl==="crit"?"var(--crit)":lvl==="warn"?"var(--warn)":"var(--acc)"}">${lvl==="crit"?"Replace "+worst.n+" "+when:lvl==="warn"?"Plan to replace "+worst.n+" in about "+dd(worst.rem)+" days":"All stages healthy. Next due: "+worst.n+" in "+dd(worst.rem)+" days"}</strong>${cause} Estimate ${lo} to ${hi} days, confidence ${p.conf}%.${p.conf<60?" Water is outside the tested range, so book a service visit.":""}`;
  // monthly
  const mv=k=>Array.from({length:12},(_,i)=>k*(1+.1*Math.sin((i+2)/12*6.283)+(i>8?.04:0)));
  $("#m1").innerHTML=`<h2>Monthly TDS (ppm)</h2>`+spark(mv(st.tds),false,"#2ee8ff","ppm");
  $("#m2").innerHTML=`<h2>Monthly usage (L)</h2>`+spark(mv(st.use*30),true,"#22e6c4","L");
  // accordion
  $("#acc").innerHTML=r.map(s=>{const on=s.i===st.sel,date=s.rem<2000?new Date(2026,9,21+Math.round(s.rem)).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"over 5 years";
    return `<div class="ac ${on?"on":""}"><button onclick="pick(${s.i})" aria-expanded="${on}"><span class="dot" style="background:${col(s.rem)}"></span>${s.i+1}# ${s.n}<b style="color:${col(s.rem)}">${dd(s.rem)}d</b></button>${on?`<div class="kv"><span>Litres used</span><span>${fm(st.use*st.ages[s.i])} L</span><span>Wear</span><span>${fm(s.used)} of ${fm(s.L)} L</span><span>Stress factor</span><span>×${s.sf.toFixed(2)}</span><span>Days left</span><span>${dd(s.rem)} (${dd(s.rem*.85)} to ${dd(s.rem*1.15)})</span><span>Replace by</span><span>${date}</span><span>Drivers</span><span>${s.why.join(", ")||"none"}</span></div><div style="padding:0 10px 8px"><button class="on" style="width:100%" onclick="done(${s.i})">Mark as replaced (about 3 min, no tools)</button></div>`:""}</div>`;}).join("");
  // bottom
  $("#wt").textContent=`Wear: ${sel.n}, actual vs predicted`;
  $("#wear").innerHTML=wear(sel);$("#tl").innerHTML=timeline(r);
  const share=r.map(s=>s.used),c=sel.con.map(x=>x),base=1;
  $("#dn").innerHTML=`<div class="dn"><div><h2>Wear distribution</h2>${donut(share,PAL)}<div class="lg">${r.map((s,i)=>`<i style="color:${PAL[i]};border-color:${PAL[i]}">${i+1}#</i>`).join("")}</div></div><div><h2>Stress drivers: ${sel.i+1}#</h2>${donut([base,...c],["#3b82f6","#ff5d6c","#ffb547","#22e6c4"])}<div class="lg"><i style="color:#3b82f6;border-color:#3b82f6">Base</i><i style="color:#ff5d6c;border-color:#ff5d6c">TDS</i><i style="color:#ffb547;border-color:#ffb547">Hard</i><i style="color:#22e6c4;border-color:#22e6c4">Turb</i></div></div></div>`;
}
function pick(i){st.sel=i;render();}
function done(i){st.ages[i]=0;st.sel=null;render();}

/* ---------- 3D scene (software renderer on a 2D canvas) ---------- */
const T={rows:null,yaw:-.7,pitch:.6,zoom:1,auto:false,ex:0,t:0,ty:null,tp:0,drag:false};
const cv=$("#cv"),cx=cv.getContext("2d");let W=800,H=600,K=40,CT={},hits=[];

  const slab=()=>{box(X(-7.4),X(7.4),-.3,0,X(-3.8),X(3.8),[12,38,58],"rgba(46,232,255,.35)");if(CT.sp>0){cx.strokeStyle="rgba(46,232,255,.12)";cx.lineWidth=1;for(let x=-7;x<=7;x++){const p=pj(X(x),0,X(-3.8)),q=pj(X(x),0,X(3.8));cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(q[0],q[1]);cx.stroke();}for(let z=-3;z<=3;z++){const p=pj(X(-7.4),0,X(z)),q=pj(X(7.4),0,X(z));cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(q[0],q[1]);cx.stroke();}plate(-5.4,-2.2,-3,-1);plate(-.6,4.2,-3,-1);plate(.8,5.6,1,3);}};
  // stages

function hitAt(e){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let b=null;hits.forEach(h=>{if(x>=h.x0&&x<=h.x1&&y>=h.y0&&y<=h.y1&&(!b||h.d<b.d))b=h;});return b?b.i:null;}
